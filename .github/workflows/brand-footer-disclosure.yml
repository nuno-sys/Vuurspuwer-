name: Accessible corporate footer disclosure
on:
  push:
    branches: [maintenance/astronivo-footer-20261028]
    paths: [.github/workflows/brand-footer-disclosure.yml]
permissions:
  contents: write
jobs:
  footer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: target
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: maintenance/astronivo-footer-20261028
          path: control
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /tools/brand-footer-disclosure.py
      - uses: actions/checkout@v5
        with:
          ref: main
          path: target
      - name: Validate and apply only the footer disclosure and its styling
        run: python3 ../control/tools/brand-footer-disclosure.py
      - name: Save only tested footer, stylesheet and build-localization changes
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          paths=json.loads(Path('brand-footer-evidence/paths.json').read_text())
          subprocess.run(['git','add','-f','--',*paths],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(paths)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Use a discreet localized ownership disclosure in the footer'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/main'],check=True)
          Path('brand-footer-evidence/commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vuurspuwer-brand-disclosure-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/brand-footer-evidence/
          retention-days: 30

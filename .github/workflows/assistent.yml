name: Boekingsassistent uitrollen

# De assistent draait als aparte Cloudflare Worker (Pages Functions kunnen
# geen periodieke taken). Deze actie rolt hem uit zodra er iets aan verandert,
# zodat Nuno nooit zelf wrangler hoeft te draaien.
# Alleen met de hand starten: de Gmail-assistent is nog niet in gebruik.
# Zodra het serviceaccount er is, kan de push-trigger er weer bij.
on:
  workflow_dispatch:

jobs:
  uitrollen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Testen
        run: node test-assistent.mjs && node test-storingen.mjs
        working-directory: assistent
      - name: Uitrollen naar Cloudflare
        run: npx --yes wrangler@latest deploy
        working-directory: assistent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

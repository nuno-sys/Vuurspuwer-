# Het masterplan: elke ochtend de tien belangrijkste pagina's van dat moment
# aanmelden bij elke zoekmachine die dat toestaat, en het dagplan voor
# Google Search Console klaarzetten. De keuze rouleert automatisch, houdt
# rekening met het seizoen (Halloween in het najaar, kerst in december,
# bruiloften in het voorjaar) en dekt in een jaar de hele site.
name: Dagelijkse indexering
on:
  schedule:
    # 06:20 UTC — ruim voor de ochtendcrawl, elke dag
    - cron: "20 6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: dagelijkse-indexering
  cancel-in-progress: false
jobs:
  aanmelden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Dagplan opstellen en aanmelden
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: python3 tools/dagplan.py

      - name: Google Search Console — sitemap indienen en status meten
        # Read-only meting plus officiele sitemap-indiening. Slaat zichzelf
        # netjes over zolang het geheim GOOGLE_SA_JSON niet is ingesteld.
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        continue-on-error: true
        run: python3 tools/gsc.py --sitemap --inspect 30

      - name: Dagplan en stand vastleggen
        # ook als het aanmelden deels faalde: de URL's zijn dan al verstuurd,
        # dus de stand moet hoe dan ook vastliggen
        if: always()
        run: |
          git config user.name  "vuurspuwer-indexeerbot"
          git config user.email "nuno@vuurspuwer.com"
          git add indexing-state.json dagplan.md gsc-status.json gsc-rapport.md 2>/dev/null || true
          git add indexing-state.json dagplan.md
          if git diff --cached --quiet; then
            echo "Niets gewijzigd."
          else
            git commit -m "Indexeer-dagplan $(date -u +%F) [skip ci]"
            # er kan tijdens de run iets anders op main zijn geland
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Opvolging van openstaande aanvragen
        # Kijkt welke aanvragen lang genoeg stil zijn en zet daar een duwtje
        # voor klaar in Nuno's postvak. Faalt dit, dan mag de indexering er
        # niet op stuklopen.
        continue-on-error: true
        env:
          SLEUTEL: ${{ secrets.OPVOLG_SLEUTEL }}
        run: |
          if [ -z "$SLEUTEL" ]; then
            echo "OPVOLG_SLEUTEL niet gezet - opvolging overgeslagen"
            exit 0
          fi
          uit=$(curl -sS --max-time 120 -w "\n%{http_code}" \
                 -H "x-sleutel: $SLEUTEL" \
                 https://vuurspuwer.com/api/opvolging || true)
          code=$(printf '%s' "$uit" | tail -n1)
          lijf=$(printf '%s' "$uit" | sed '$d')
          echo "status $code: $lijf"
          {
            echo "## Opvolging"
            echo
            echo "status $code — $lijf"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Samenvatting
        run: |
          {
            echo "## Indexering $(date -u +%F)"
            echo
            cat dagplan.md
          } >> "$GITHUB_STEP_SUMMARY"

name: Publish AstroNivo link in static footer output
on:
  push:
    branches: [maintenance/astronivo-footer-20261028]
    paths: [.github/workflows/astronivo-footer-dist.yml]
permissions:
  contents: write
jobs:
  footer-output:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Verify production preimages and add only the same footer anchor
        run: |
          python3 - <<'PY'
          import hashlib,json,re,subprocess
          from pathlib import Path
          def blob(p):
              raw=p.read_bytes();return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob(Path('index.html'))=='00e6fd1ffabb5bcec09e032b6ba00cd265041e25','Reviewed source changed'
          assert blob(Path('dist/index.html'))=='ea1cefd298c7707bafb4110554fe7e2e19a2d95b','Reviewed production output changed'
          marker='<a href="https://eurozena.com/">EuroZena</a>'
          add='\n      <span aria-hidden="true">&middot;</span>\n      <a href="https://astronivo.com/">AstroNivo</a>'
          rows=[]
          names=['index.html',*subprocess.check_output(['git','ls-files','dist'],text=True).splitlines()]
          for name in names:
              p=Path(name)
              if p.suffix!='.html':continue
              raw=p.read_bytes();text=raw.decode();footers=list(re.finditer(r'<footer\b[^>]*>.*?</footer>',text,re.I|re.S))
              relevant=[f for f in footers if 'href="https://euroacts.com/"' in f.group() and marker in f.group()]
              if not relevant:continue
              assert len(relevant)==1 and relevant[0].group().count(marker)==1,(name,'ambiguous footer')
              before=relevant[0];old=before.group()
              assert 'href="https://astronivo.com/"' not in old,('Already updated',name)
              new=old.replace(marker,marker+add)
              changed=text[:before.start()]+new+text[before.end():]
              assert changed.replace(add,'',1)==text,(name,'non-footer difference')
              for host,label in [('euroacts.com','EuroActs'),('eurozena.com','EuroZena'),('astronivo.com','AstroNivo')]:
                  assert new.count('href="https://'+host+'/"')==1 and '<a href="https://'+host+'/">'+label+'</a>' in new
              p.write_bytes(changed.encode())
              rows.append({'path':name,'before_sha256':hashlib.sha256(raw).hexdigest(),'after_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'only_addition':add})
          paths={r['path'] for r in rows}
          assert {'index.html','dist/index.html','dist/en/index.html','dist/de/index.html','dist/fr/index.html'}<=paths,sorted(paths)
          assert len(paths)>=100,len(paths)
          modified=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines());assert modified==paths
          out=Path('footer-output-evidence');out.mkdir()
          (out/'validated-output.json').write_text(json.dumps({'branch':'main','pages':len(rows)-1,'source_and_output_consistent':True,'non_footer_bytes_unchanged':True,'files':rows},indent=2)+'\n')
          (out/'paths.txt').write_text('\n'.join(sorted(paths))+'\n')
          print(json.dumps({'validated_footer_only_pages':len(rows)-1,'template':True}))
          PY
      - name: Commit only the validated template and static pages to production
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          paths=Path('footer-output-evidence/paths.txt').read_text().splitlines()
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(paths)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add only AstroNivo beside the existing related-site footer links'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > footer-output-evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vuurspuwer-static-footer-${{ github.run_id }}
          path: footer-output-evidence/
          retention-days: 14

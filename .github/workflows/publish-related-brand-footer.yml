name: Publish generated related-brand footer
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-related-brand-footer.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-related-brand-footer
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Update generated shared footer and matching asset versions
        run: |
          python3 - <<'PUBLISH'
          import ast,hashlib,json,re,subprocess
          from pathlib import Path
          from html.parser import HTMLParser
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='a0030728739334d381241d0cf780e1756e0f0761','Source changed; inspect before publishing'
          source=Path('index.html').read_text()
          navs=re.findall(r'<nav class="foot__network"[^>]*>.*?</nav>',source,re.S)
          assert len(navs)==1
          nav=navs[0]
          assert 'href="https://euroacts.com/"' in nav and 'href="https://eurozena.com/"' in nav
          assert not re.search(r'\brel=',nav)
          builder=ast.parse(Path('build.py').read_text())
          minifiers=[node for node in builder.body if isinstance(node,ast.FunctionDef) and node.name=='_minify_css']
          assert len(minifiers)==1
          scope={'re':re}
          exec(compile(ast.Module(body=minifiers,type_ignores=[]),'existing-css-minifier','exec'),scope)
          css=Path('assets/site.css').read_text()
          for text in re.findall(r'content:\s*"([^"]*)"',css):
              assert not any(char in text for char in '{};,')
          new_css=scope['_minify_css'](css)
          assert '.foot__network{' in new_css
          assert '.foot__network{' not in Path('dist/assets/site.css').read_text()
          sw=Path('dist/sw.js').read_text()
          versions=re.findall(r'const V = "vs-([a-f0-9]{10})";',sw)
          assert len(versions)==1
          old_version=versions[0]
          new_version=hashlib.md5(b''.join(Path('assets',name).read_bytes() for name in ('site.css','site.js','ga.js','zoek.js'))).hexdigest()[:10]
          assert new_version!=old_version
          labels={'nl':'Ontdek ook','en':'Discover more','de':'Auch entdecken','fr':'À découvrir aussi'}
          class FooterLinks(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside=False
                  self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='footer':self.inside=True
                  if tag=='a' and self.inside:self.links.append(dict(attrs))
              def handle_endtag(self,tag):
                  if tag=='footer':self.inside=False
          counts={language:0 for language in labels}
          paths=sorted(Path('dist').rglob('*.html'))
          changed=[]
          for path in paths:
              old=path.read_text()
              updated=old
              if '<footer' in old:
                  match=re.search(r'<html\b[^>]*\blang=["\']([^"\']+)["\']',old)
                  assert match,'Missing language: '+str(path)
                  language=match.group(1).lower().split('-')[0]
                  assert language in labels
                  marker='<div class="foot__bar">\n    <span>&copy;'
                  assert old.count(marker)==1,'Unexpected shared footer: '+str(path)
                  assert 'class="foot__network"' not in old,'Already modified: '+str(path)
                  localized=nav.replace('Ontdek ook',labels[language])
                  updated=old.replace(marker,'<div class="foot__bar">\n    '+localized+'\n    <span>&copy;',1)
                  parser=FooterLinks()
                  parser.feed(updated)
                  for host in ('euroacts.com','eurozena.com'):
                      matches=[link for link in parser.links if link.get('href')=='https://'+host+'/']
                      assert len(matches)==1 and not matches[0].get('rel'),str(path)+' missing normal brand anchor'
                  counts[language]+=1
              updated=updated.replace('?v='+old_version,'?v='+new_version)
              assert '?v='+old_version not in updated
              if updated!=old:
                  path.write_text(updated)
                  changed.append(path.as_posix())
          assert all(counts.values()) and sum(counts.values())>=180,counts
          Path('dist/assets/site.css').write_text(new_css)
          headers=Path('dist/_headers').read_text()
          assert '?v='+old_version in headers
          Path('dist/_headers').write_text(headers.replace('?v='+old_version,'?v='+new_version))
          updated_sw=sw.replace('vs-'+old_version,'vs-'+new_version).replace('?v='+old_version,'?v='+new_version)
          assert old_version not in updated_sw
          Path('dist/sw.js').write_text(updated_sw)
          allowed=set(changed)|{'dist/assets/site.css','dist/_headers','dist/sw.js'}
          actual=set(git('diff','--name-only').splitlines())
          assert actual==allowed,{'unexpected':sorted(actual-allowed),'missing':sorted(allowed-actual)}
          subprocess.run(['git','diff','--check'],check=True)
          print(json.dumps({'html_files':len(paths),'localized_footers':counts,'old_asset_version':old_version,'new_asset_version':new_version,'changed_generated_files':len(actual),'source_and_generated_footer_consistent':True},ensure_ascii=False),flush=True)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','rm','.github/workflows/publish-related-brand-footer.yml'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Publish related-brand footer in generated pages and refresh asset versions'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print('PUBLISHED_GENERATED_FOOTER_COMMIT='+git('rev-parse','HEAD'),flush=True)
          PUBLISH
